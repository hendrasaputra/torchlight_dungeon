<style>

<style>

#main { flex: 1; display: flex; gap: 8px; margin: 0 8px 8px; min-height: 0; }

.q-art { border-color: var(--q-art) !important; box-shadow: 0 0 6px #f0a83088; } .q-unknown { border-color: var(--q-unknown) !important; }
.card.q-cursed b { color: var(--q-cursed); } .card.q-magic b { color: var(--q-magic); } .card.q-ego b { color: var(--q-ego); } .card.q-art b { color: var(--q-art); }
#prompt { left: 50%; top: 12px; transform: translateX(-50%); background: #2a2010ee; border: 2px solid var(--gold); color: #ffe9b0; padding: 6px 14px; border-radius: 6px; white-space: nowrap; }
#panel { width: 372px; flex: none; background: var(--panel); border: 2px solid var(--edge); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

#tab .name { font-size: 16px; } .sub { color: var(--dim); }

.row4 { display: flex; gap: 6px; justify-content: center; }

h3 { margin: 12px 0 6px; font-size: 11px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: normal; }
.grid { display: grid; grid-template-columns: repeat(6, 52px); gap: 4px; justify-content: center; margin: 8px 0; }
.sel { outline: 2px solid var(--gold); outline-offset: 1px; }

.msgs div { font-size: 12px; padding: 2px 0; border-bottom: 1px solid #2a2636; }
.beast { display: flex; gap: 8px; margin: 6px 0; } .beast small { color: var(--dim); display: block; }

.card p { display: flex; justify-content: space-between; margin: 3px 0; } .card hr { border: 0; border-top: 1px solid var(--edge); margin: 6px 0; }
.card p span:last-child { color: var(--gold); }
#dlg, #screen { position: absolute; inset: 0; display: grid; place-items: center; z-index: 10; }
#dlg { background: #0008; } #dlg[hidden], #screen[hidden], #target[hidden], #prompt[hidden], #ov[hidden] { display: none; }

#dlg .box.wide { min-width: 860px; } #dlg h2 { margin: 0 0 8px; font-size: 16px; color: var(--gold); font-weight: normal; }

#dlg .side { width: 290px; flex: none; } #dlg .side .card { border-color: var(--edge); }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; }
.row span { flex: 1; } .row small { color: var(--gold); } .row.sel { border-color: var(--gold); background: #2a2010; outline: none; } .row.off { opacity: .45; }
.row[class*="q-"] { border-left-width: 4px; }
.note { color: var(--dim); font-size: 11px; margin-top: 8px; } kbd { display: inline-block; min-width: 140px; color: var(--gold); font: inherit; }
.shopline { display: flex; gap: 16px; margin-bottom: 8px; color: #cfc8b8; }
#screen { background: radial-gradient(ellipse at center, #0000 0, #000a 70%); }
.titlecard { text-align: center; background: #0c0b12cc; border: 2px solid var(--edge); border-radius: 10px; padding: 26px 40px; max-width: 640px; }
.titlecard h1 { font: 700 44px/1 Georgia, "Times New Roman", serif; letter-spacing: .14em; color: #ffcf70; text-shadow: 0 0 18px #ff8a2088, 0 3px 0 #5a2a00; text-transform: uppercase; margin: 0 0 6px; }
.titlecard h1 span { display: block; font-size: 26px; letter-spacing: .4em; color: #f0e2c0; margin-top: 8px; }
.blink { animation: blink 1.2s steps(2) infinite; color: #fff; } @keyframes blink { 50% { opacity: .35; } }
.fame { font-size: 12px; color: var(--dim); } .fame.best { color: var(--text); } .fame b { color: var(--gold); display: inline-block; min-width: 52px; text-align: right; margin-right: 6px; }
.tomb .rip { font-size: 40px; color: #d8d0c0; text-shadow: none; }

.steps { display: flex; gap: 18px; margin-bottom: 12px; } .steps b { color: #5a5468; font-weight: normal; } .steps b.on { color: var(--gold); } .steps b.done { color: var(--dim); }

.cinfo h2 { margin: 0 0 6px; color: var(--gold); font-weight: normal; } .cinfo .stats { margin: 8px 0; }
.preview { display: grid; place-items: center; background: #13111a; border: 2px solid var(--edge); border-radius: 8px; padding: 10px; }
.namebox { margin-top: 8px; padding: 6px 10px; border: 2px solid var(--gold); border-radius: 4px; font-size: 16px; } .caret { animation: blink 1s steps(2) infinite; }

<body>
<header>
  <h1>Torchlight Dungeons</h1>
  <div id="hud">arrows move &middot; A attack &middot; S spell &middot; D drink &middot; W grab &middot; Tab target &middot; I C B J M panel &middot; ? keys &middot; Esc menu</div>
</header>
<div id="main">
  <div id="stage">
    <canvas id="cv" aria-label="The dungeon map around you."></canvas>
    <div id="ov" hidden>
      <div id="status"></div>
      <div id="minibox"><canvas id="mini" width="240" height="132"></canvas><div id="target" hidden></div></div>
      <div id="log" aria-live="polite"></div>
      <div id="bar"></div>
      <div id="prompt" hidden></div>
    </div>
    <div id="screen" hidden></div>
    <div id="dlg" hidden></div>
  </div>
  <aside id="panel" hidden><div id="tabs"></div><div id="tab"></div></aside>
</div>
<div id="tip" hidden></div>
<script>
/* ---------- Torchlight Dungeons: small helpers (from the ASCII BaseCommander arcade library) ---------- */
// Saved preferences and high scores, sound, refitting on real resizes, and the frame loop.

// Saved settings for one game, under "<prefix><key>" in localStorage. Values are strings; *JSON for anything else.
function prefs(prefix, label){
  return {
    get(k, d = null){ try { const v = localStorage.getItem(prefix + k); return v === null ? d : v; } catch (e){ return d; } },
    set(k, v){ try { localStorage.setItem(prefix + k, v); return true; } catch (e){ console.warn(label + ": could not save " + k, e); return false; } },
    getJSON(k, d){ const v = this.get(k); if (v === null) return d; try { return JSON.parse(v); } catch (e){ console.warn(label + ": saved " + k + " unreadable, using defaults", e); return d; } },
    setJSON(k, v){ return this.set(k, JSON.stringify(v)); },
    del(k){ try { localStorage.removeItem(prefix + k); } catch (e){ console.warn(label + ": could not remove " + k, e); } }
  };
}
// A saved top-n list. add() returns the new entry's rank (0 is best) and whether saving worked.
function scoreTable(store, n = 5, key = "scores", better = (a, b) => b.score - a.score){
  const list = store.getJSON(key, []);
  return { list, add(entry){ list.push(entry); list.sort(better); list.length = Math.min(list.length, n); return { rank: list.indexOf(entry), saved: store.setJSON(key, list) }; } };
}

// Sound from base64 MP3s. Browsers only allow audio after a user gesture, so nothing is decoded until unlock().
// sounds: { name: base64 }; music: { name: { data, loopStart, loopEnd } }, looped between margins cut from the
// recording so MP3 padding never lands inside the loop. vol: per-sound gain (volume for the rest). minGap: seconds within which a
// sound plays only once (a volley from many enemies still makes one sound). The mute choice is saved.
function createAudio({ label, store, sounds, music = {}, vol = {}, volume = 0.6, sfxGain = 0.9, musicGain = 0.5, minGap = 0 }){
  let ctx = null, master = null, sfxBus = null, musicBus = null, unlocked = false, waiting = null, song = null, songNode = null;
  let muted = store.get("muted") === "1", musicOn = store.get("music") !== "0";
  const buffers = {}, lastPlayed = {};
  function startSong(){
    const b = song && buffers["music:" + song]; if (!ctx || !b || songNode) return;
    const M = music[song], src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = b; src.loop = true; src.loopStart = M.loopStart; src.loopEnd = M.loopEnd;
    src.connect(g); g.connect(musicBus); src.start(0, M.loopStart); src.g = g; songNode = src;
  }
  const A = {
    get unlocked(){ return unlocked; }, get muted(){ return muted; }, get musicOn(){ return musicOn; },
    unlock(){
      if (unlocked) return;
      unlocked = true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC){ console.warn(label + ": Web Audio not supported, playing silent"); return; }
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = sfxGain; sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = musicOn ? musicGain : 0; musicBus.connect(master);
      const decode = (key, b64, done) => ctx.decodeAudioData(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer,
        b => { buffers[key] = b; done(); }, e => console.warn(label + ": could not decode sound", key, e));
      for (const [k, v] of Object.entries(sounds)) decode(k, v, () => { if (k === waiting){ waiting = null; A.play(k); } });   // the first tap may start a sound before it is decoded
      for (const [k, v] of Object.entries(music)) decode("music:" + k, v.data, () => { if (k === song) startSong(); });
    },
    play(name, pan){   // pan: sweep from -pan to +pan over the sound
      if (muted || !ctx) return;
      const b = buffers[name]; if (!b){ waiting = name; return; }
      const now = ctx.currentTime;
      if (minGap && now - (lastPlayed[name] ?? -1) < minGap) return;
      lastPlayed[name] = now;
      const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = b; g.gain.value = vol[name] ?? volume;
      src.connect(g);
      if (pan && ctx.createStereoPanner){
        const p = ctx.createStereoPanner(); p.pan.setValueAtTime(-pan, now); p.pan.linearRampToValueAtTime(pan, now + b.duration);
        g.connect(p); p.connect(sfxBus);
      } else g.connect(sfxBus);
      src.start();
    },
    music(name){   // switch to a song (fading the old one out); null stops the music
      if (song === name) return;
      song = name;
      if (songNode){ songNode.g.gain.setTargetAtTime(0, ctx.currentTime, 0.3); songNode.stop(ctx.currentTime + 1.5); songNode = null; }
      startSong();
    },
    toggleMute(){
      A.unlock(); muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.02);
      store.set("muted", muted ? "1" : "0");
    },
    toggleMusic(){   // music on or off, sound effects unchanged (added for Torchlight Dungeons)
      musicOn = !musicOn;
      if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? musicGain : 0, ctx.currentTime, 0.1);
      store.set("music", musicOn ? "1" : "0");
    },
    pause(){ if (ctx) ctx.suspend(); }, resume(){ if (ctx) ctx.resume(); }
  };
  return A;
}

// Calls fn after real size changes (rotation, window resize), not the mobile address bar sliding in and out,
// which would make the game jump while you play.
function onResize(stage, fn){
  let fitted = stage.getBoundingClientRect();
  new ResizeObserver(() => {
    const r = stage.getBoundingClientRect();
    if (Math.abs(r.width - fitted.width) < 1 && Math.abs(r.height - fitted.height) < fitted.height * 0.15) return;
    fitted = r; fn();
  }).observe(stage);
}
// The frame loop: step(dt, t) at most ~60 times a second (120 Hz displays call more often than a game needs),
// with dt capped at 1/30 s so a stall never makes things jump.
function startLoop(step){
  const FRAME_MS = 1000 / 60;
  let last = 0, next = 0;
  function tick(t){
    requestAnimationFrame(tick);
    if (t < next - 1) return;
    next = t - next > FRAME_MS ? t + FRAME_MS : next + FRAME_MS;
    const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
    step(dt, t);
  }
  requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });

/* ---------- Torchlight Dungeons: seeded random numbers ---------- */
// One small generator (mulberry32), so a level or a whole game can be replayed from its seed, and its state saved.
class RNG {
  constructor(seed){ this.s = (seed >>> 0) || 1; }
  next(){
    let a = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    a = Math.imul(a ^ a >>> 15, a | 1); a ^= a + Math.imul(a ^ a >>> 7, a | 61);
    return ((a ^ a >>> 14) >>> 0) / 4294967296;
  }
  int(n){ return Math.floor(this.next() * n); }              // 0 .. n - 1
  range(a, b){ return a + this.int(b - a + 1); }             // a .. b
  chance(p){ return this.next() < p; }
  pick(arr){ return arr[this.int(arr.length)]; }
  dice(s){ const [n, d] = s.split("d").map(Number); let t = 0; for (let i = 0; i < n; i++) t += 1 + this.int(d); return t; }   // "2d6"
  shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = this.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  weighted(list, w){ let sum = 0; for (const x of list) sum += w(x); let r = this.next() * sum; for (const x of list){ r -= w(x); if (r < 0) return x; } return list[list.length - 1]; }
}
/* ---------- Torchlight Dungeons: field of view and the light field ---------- */
// Symmetric shadowcasting, written from Albert Ford's public description of the algorithm: if A can see B, B can see
// A, so "the monster sees you" and "you see the monster" always agree. Walls that bound the view are seen too.
// blocks(x, y) says whether a cell stops sight (out-of-bounds cells must block); see(x, y) is called once per cell.
let fovStamp = null, fovMark = 0, fovW = 0;
function fov(ox, oy, radius, blocks, see, w, h){
  if (!fovStamp || fovStamp.length !== w * h){ fovStamp = new Uint32Array(w * h); fovMark = 0; }
  fovW = w; fovMark++;
  const r2 = radius * (radius + 1), mark = fovMark;
  const show = (x, y) => { if (x < 0 || y < 0 || x >= w || y >= h) return; const i = y * fovW + x; if (fovStamp[i] !== mark){ fovStamp[i] = mark; see(x, y); } };
  show(ox, oy);
  for (let q = 0; q < 4; q++){
    // the four quadrants: north, east, south, west; (depth, col) -> map cell
    const tx = (d, c) => q === 0 ? ox + c : q === 1 ? ox + d : q === 2 ? ox + c : ox - d;
    const ty = (d, c) => q === 0 ? oy - d : q === 1 ? oy + c : q === 2 ? oy + d : oy + c;
    const scan = (depth, start, end) => {
      if (depth > radius) return;
      let prev = 0;   // 0 none yet, 1 wall, 2 floor
      const c0 = Math.floor(depth * start + 0.5), c1 = Math.ceil(depth * end - 0.5);
      for (let c = c0; c <= c1; c++){
        const x = tx(depth, c), y = ty(depth, c), wall = blocks(x, y);
        if ((wall || (c >= depth * start && c <= depth * end)) && c * c + depth * depth <= r2) show(x, y);
        if (prev === 1 && !wall) start = (2 * c - 1) / (2 * depth);
        if (prev === 2 && wall) scan(depth + 1, start, (2 * c - 1) / (2 * depth));
        prev = wall ? 1 : 2;
      }
      if (prev === 2) scan(depth + 1, start, end);
    };
    scan(1, -1, 1);
  }
}
// Adds one light source into a field of RGB light (3 floats per cell): it lights every cell it can see, fading
// with distance, so walls cast real shadows. src: { x, y, r: radius in cells, i: intensity, rgb }.
function addLight(field, w, h, blocks, src){
  if (src.r <= 0) return;
  const R = src.r + 0.5;
  fov(src.x, src.y, Math.ceil(src.r), blocks, (x, y) => {
    const k = 1 - Math.hypot(x - src.x, y - src.y) / R; if (k <= 0) return;
    const v = src.i * k * k, j = 3 * (y * w + x);
    field[j] += src.rgb[0] * v; field[j + 1] += src.rgb[1] * v; field[j + 2] += src.rgb[2] * v;
  }, w, h);
}
const lum = (f, j) => 0.2126 * f[j] + 0.7152 * f[j + 1] + 0.0722 * f[j + 2];
/* ---------- Torchlight Dungeons: turns ---------- */
// Energy scheduler: every tick each actor gains energy by its speed, and whoever reaches 100 acts. Speed +10 acts
// twice as often as speed 0, and -10 half as often.
const energyGain = speed => 10 * Math.pow(2, speed / 10);
function nextActor(actors){
  for (;;){
    let best = null;
    for (const a of actors) if (a.energy >= 100 && (!best || a.energy > best.energy)) best = a;
    if (best) return best;
    for (const a of actors) a.energy += energyGain(a.speed);
  }
}
/* ---------- Torchlight Dungeons: level generation ---------- */
// Rooms of a few shapes joined by corridors, with doors where a corridor passes through a room's wall, and stairs.
// Original code: the layout ideas (rooms, tunnels, lit rooms that get rarer with depth) are common to the genre.
const MW = 198, MH = 66;   // map size, as in Moria
// Town tiles: GROUND (open ground), SHOP (a shop's entrance; L.shopAt says which), LAMP (a lamp post: blocks your
// way but not your view). From RUBBLE on (phase 8) the tiles block both, and can be dug: rubble, veins of magma and
// quartz (the _T ones hold treasure), and SECRET, a door that looks like the wall until it is found.
const T = { EDGE: 0, WALL: 1, FLOOR: 2, DOOR: 3, OPEN: 4, DOWN: 5, UP: 6, SHOP: 7, GROUND: 8, LAMP: 9, RUBBLE: 10, MAGMA: 11, QUARTZ: 12, MAGMA_T: 13, QUARTZ_T: 14, SECRET: 15 };
const passable = t => t >= T.FLOOR && t !== T.DOOR && t !== T.LAMP && t < T.RUBBLE;   // closed doors open when you walk into them
const opaque = t => t <= T.WALL || t === T.DOOR || t >= T.RUBBLE;
const rocky = t => t === T.WALL || (t >= T.RUBBLE && t !== T.SECRET);   // what digging, tunnelling monsters and earthquakes break
// How hard each kind of rock is to dig: digging adds your digging power each turn until it reaches this.
const HARDNESS = { [T.RUBBLE]: 60, [T.MAGMA]: 250, [T.MAGMA_T]: 250, [T.QUARTZ]: 400, [T.QUARTZ_T]: 400, [T.WALL]: 900 };

function generateLevel(rng, depth){
  const tiles = new Uint8Array(MW * MH).fill(T.WALL), room = new Int16Array(MW * MH).fill(-1), lit = new Uint8Array(MW * MH);
  const lock = new Int8Array(MW * MH), trap = new Uint8Array(MW * MH), trapSeen = new Uint8Array(MW * MH);   // trap: 0 none, else 1 + its index in TRAPS
  for (let x = 0; x < MW; x++){ tiles[x] = T.EDGE; tiles[(MH - 1) * MW + x] = T.EDGE; }
  for (let y = 0; y < MH; y++){ tiles[y * MW] = T.EDGE; tiles[y * MW + MW - 1] = T.EDGE; }
  const rooms = [];
  const free = (x0, y0, x1, y1) => {   // inside the map, and not touching another room (one cell of wall between)
    if (x0 < 2 || y0 < 2 || x1 > MW - 3 || y1 > MH - 3) return false;
    for (let y = y0 - 2; y <= y1 + 2; y++) for (let x = x0 - 2; x <= x1 + 2; x++) if (room[y * MW + x] >= 0) return false;
    return true;
  };
  const target = 20 + rng.int(10);
  for (let tries = 0; rooms.length < target && tries < 600; tries++){
    const w = 4 + rng.int(14), h = 3 + rng.int(7), x0 = 2 + rng.int(MW - w - 4), y0 = 2 + rng.int(MH - h - 4), x1 = x0 + w - 1, y1 = y0 + h - 1;
    if (!free(x0, y0, x1, y1)) continue;
    const id = rooms.length, isLit = rng.int(28) + 1 > depth;   // lit rooms are common near the top, rare deep down
    const shape = w >= 9 && h >= 5 ? rng.pick(["plain", "plain", "plain", "cross", "pillars"]) : "plain";
    const cells = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
      if (shape === "cross"){   // a plus shape: drop the four corners
        const cxw = Math.floor(w / 4), cyh = Math.floor(h / 3);
        if ((x < x0 + cxw || x > x1 - cxw) && (y < y0 + cyh || y > y1 - cyh)) continue;
      }
      if (shape === "pillars" && (x - x0) % 2 === 1 && (y - y0) % 2 === 1 && x < x1 && y < y1) continue;   // a pillared hall
      cells.push(y * MW + x);
    }
    for (const i of cells){ tiles[i] = T.FLOOR; room[i] = id; }
    // the room's walls belong to it too, so they are lit with it and doors can be placed in them
    for (const i of cells) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const j = i + dy * MW + dx; if (tiles[j] === T.WALL && room[j] < 0) room[j] = id;
    }
    if (isLit) for (let y = y0 - 1; y <= y1 + 1; y++) for (let x = x0 - 1; x <= x1 + 1; x++) if (room[y * MW + x] === id) lit[y * MW + x] = 1;
    rooms.push({ id, x0, y0, x1, y1, lit: isLit, cells, cx: (x0 + x1) >> 1, cy: (y0 + y1) >> 1 });
  }
  // corridors: each room to the next one from left to right, then a few extra links so there are loops
  const order = [...rooms].sort((a, b) => a.cx - b.cx);
  const carved = new Uint8Array(MW * MH);
  const dig = i => { if (tiles[i] === T.WALL){ tiles[i] = T.FLOOR; carved[i] = 1; } };
  const tunnel = (a, b) => {
    let x = a.cx, y = a.cy;
    const hFirst = rng.chance(0.5), bendX = hFirst ? b.cx : a.cx, bendY = hFirst ? a.cy : b.cy;
    const walk = (tx, ty) => { while (x !== tx || y !== ty){ if (x !== tx) x += Math.sign(tx - x); else y += Math.sign(ty - y); dig(y * MW + x); } };
    walk(bendX, bendY); walk(b.cx, b.cy);
  };
  for (let i = 1; i < order.length; i++) tunnel(order[i - 1], order[i]);
  for (let k = 0; k < 3 + rng.int(4); k++) tunnel(rng.pick(rooms), rng.pick(rooms));
  // doors: a carved cell in a room's wall that a corridor passes straight through
  for (let i = 0; i < tiles.length; i++){
    if (!carved[i] || room[i] < 0 || tiles[i] !== T.FLOOR) continue;
    const ns = passable(tiles[i - MW]) && passable(tiles[i + MW]) && opaque(tiles[i - 1]) && opaque(tiles[i + 1]);
    const ew = passable(tiles[i - 1]) && passable(tiles[i + 1]) && opaque(tiles[i - MW]) && opaque(tiles[i + MW]);
    if (!(ns || ew) || !rng.chance(0.75)) continue;
    if (!rng.chance(0.65)){ tiles[i] = T.OPEN; continue; }
    // a closed door may be hidden (more of them deeper down), locked (lock > 0: how hard to pick) or stuck (lock < 0)
    tiles[i] = rng.chance(Math.min(0.4, 0.05 + depth * 0.01)) ? T.SECRET : T.DOOR;
    if (rng.chance(0.15 + depth * 0.005)) lock[i] = 1 + rng.int(2 + depth / 4); else if (rng.chance(0.08)) lock[i] = -1;
  }
  // now and then a corridor is choked with rubble
  for (let i = 0; i < tiles.length; i++) if (carved[i] && room[i] < 0 && tiles[i] === T.FLOOR && rng.chance(1 / 70)) tiles[i] = T.RUBBLE;
  // veins of magma and quartz wander through the rock between rooms; a few of their cells hold treasure
  for (let v = 0, n = 3 + rng.int(4); v < n; v++){
    const quartz = rng.chance(Math.min(0.5, 0.15 + depth * 0.02)), rich = quartz ? 1 / 12 : 1 / 25;
    let x = 2 + rng.int(MW - 4), y = 2 + rng.int(MH - 4), a = rng.next() * 6.283;
    for (let k = 0, len = 60 + rng.int(100); k < len; k++){
      a += (rng.next() - 0.5) * 0.8; x += Math.cos(a); y += Math.sin(a) * 0.6;
      for (const [dx, dy] of [[0, 0], [1, 0], [0, 1]]){
        const cx = Math.round(x) + dx, cy = Math.round(y) + dy, i = cy * MW + cx;
        if (cx < 1 || cy < 1 || cx >= MW - 1 || cy >= MH - 1 || tiles[i] !== T.WALL || room[i] >= 0) continue;
        tiles[i] = rng.chance(rich) ? (quartz ? T.QUARTZ_T : T.MAGMA_T) : quartz ? T.QUARTZ : T.MAGMA;
      }
    }
  }
  // stairs, on room floor away from doors
  const spot = () => {
    for (let tries = 0; tries < 500; tries++){
      const r = rng.pick(rooms), i = rng.pick(r.cells);
      if (tiles[i] !== T.FLOOR) continue;
      let nearDoor = false; for (const d of [1, -1, MW, -MW]) if (tiles[i + d] === T.DOOR || tiles[i + d] === T.OPEN || tiles[i + d] === T.SECRET) nearDoor = true;
      if (!nearDoor) return i;
    }
    return rooms[0].cells[0];
  };
  for (let k = 0; k < 1 + rng.int(2); k++) tiles[spot()] = T.DOWN;
  for (let k = 0; k < 1 + rng.int(2); k++) tiles[spot()] = T.UP;   // on level 1 they lead up to the town
  // traps, on floor in rooms and corridors (TRAPS is in data.js)
  const floors = []; for (let i = 0; i < tiles.length; i++) if (tiles[i] === T.FLOOR) floors.push(i);
  const kinds = TRAPS.map((Tr, k) => k).filter(k => TRAPS[k].depth <= depth);
  for (let k = 0, n = 2 + rng.int(3) + Math.floor(depth / 4); k < n; k++) trap[rng.pick(floors)] = 1 + rng.pick(kinds);
  return { tiles, room, lit, rooms, spot, lock, trap, trapSeen, w: MW, h: MH };
}

/* ---------- the town ---------- */
// A walled town on the surface: six shops in two rows along a main street, a few houses, lamp posts, and the
// stairs down. It uses the top-left TW x TH of the map; L.w and L.h tell the camera where it ends.
const TW = 80, TH = 26;
function generateTown(rng){
  const tiles = new Uint8Array(MW * MH).fill(T.EDGE), room = new Int16Array(MW * MH).fill(-1), lit = new Uint8Array(MW * MH);
  const shopAt = new Int8Array(MW * MH).fill(-1), at = (x, y) => y * MW + x;
  for (let y = 1; y < TH - 1; y++) for (let x = 1; x < TW - 1; x++) tiles[at(x, y)] = T.GROUND;
  const shops = [], houses = [], lamps = [];
  const building = (x0, y0, w, h) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) tiles[at(x, y)] = T.WALL; };
  // shops: three facing the street from above, three from below; the street runs along the middle
  const order = rng.shuffle([0, 1, 2, 3, 4, 5]), street = TH >> 1;
  for (let k = 0; k < 6; k++){
    const top = k < 3, col = k % 3, w = 12 + rng.int(4), h = 5, x0 = 5 + col * 25 + rng.int(4), y0 = top ? street - h - 2 - rng.int(2) : street + 3 + rng.int(2);
    building(x0, y0, w, h);
    const dx = x0 + 2 + rng.int(w - 4), dy = top ? y0 + h - 1 : y0, door = at(dx, dy);   // the entrance faces the street
    tiles[door] = T.SHOP; shopAt[door] = order[k];
    shops[order[k]] = { x0, y0, w, h, door };
  }
  // small houses, and lamp posts along the street
  for (let tries = 0; tries < 60 && houses.length < 6; tries++){
    const w = 4 + rng.int(4), h = 3 + rng.int(2), x0 = 2 + rng.int(TW - w - 4), y0 = 2 + rng.int(TH - h - 4);
    let free = true;
    for (let y = y0 - 1; y <= y0 + h && free; y++) for (let x = x0 - 1; x <= x0 + w && free; x++) if (tiles[at(x, y)] !== T.GROUND || Math.abs(y - street) <= 1) free = false;
    if (free){ building(x0, y0, w, h); houses.push({ x0, y0, w, h }); }
  }
  for (let x = 6; x < TW - 4; x += 12) for (const y of [street - 1, street + 1]) if (tiles[at(x, y)] === T.GROUND){ tiles[at(x, y)] = T.LAMP; lamps.push(at(x, y)); }
  // the stairs down, somewhere on open ground away from the street
  const ground = []; for (let i = 0; i < tiles.length; i++) if (tiles[i] === T.GROUND) ground.push(i);
  let down;
  do down = rng.pick(ground); while (Math.abs(Math.floor(down / MW) - street) < 3);
  tiles[down] = T.DOWN;
  return { tiles, room, lit, rooms: [{ cells: ground.filter(i => i !== down) }], spot: () => down, lock: new Int8Array(MW * MH), trap: new Uint8Array(MW * MH), trapSeen: new Uint8Array(MW * MH), w: TW, h: TH, town: true, shops, shopAt, lamps, houses, street };
}
// Every cell a player can stand on, reached from the first room (closed, locked and secret doors, and rubble, count
// as passable: they can all be opened, found or dug).
function reachable(L){
  const seen = new Uint8Array(MW * MH), stack = [L.rooms[0].cells[0]]; seen[stack[0]] = 1;
  while (stack.length){
    const i = stack.pop();
    for (const d of [1, -1, MW, -MW, MW + 1, MW - 1, -MW + 1, -MW - 1]){
      const j = i + d; if (seen[j] || !(passable(L.tiles[j]) || L.tiles[j] === T.DOOR || L.tiles[j] === T.SECRET || L.tiles[j] === T.RUBBLE)) continue;
      seen[j] = 1; stack.push(j);
    }
  }
  return seen;
}

// entry gives its own (the first fifteen kinds keep their phase 1 numbers).

/* ---------- longer actions: running and resting stop when something happens ---------- */
let resting = false;
function run(dx, dy){
  if (state !== "play") return;
  disturbed = false;
  const open = (x, y) => passable(L.tiles[idx(x, y)]) && !monAt(x, y) && !(L.trap[idx(x, y)] && L.trapSeen[idx(x, y)]);
  for (let n = 0; n < 200 && state === "play" && !disturbed; n++){
    if (mons.some(m => m.K && seesMon(m) && !m.K.still)) break;
    if (!open(player.x + dx, player.y + dy)){
      // in a corridor, follow a single bend
      if (dx && dy) break;
      const turns = (dx ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0]]).filter(([a, b]) => open(player.x + a, player.y + b));
      if (turns.length !== 1) break;
      [dx, dy] = turns[0];
    }
    if (!act(() => tryMove(dx, dy))) break;
    const t = L.tiles[idx(player.x, player.y)];
    if (t === T.DOWN || t === T.UP || itemsAt(player.x, player.y).length) break;
    let doors = 0; for (const k of [1, 2, 3, 4, 6, 7, 8, 9]){ const [a, b] = DIRS[k], u = L.tiles[idx(player.x + a, player.y + b)]; if (u === T.DOOR || u === T.OPEN) doors++; }
    if (doors) break;
  }
}
function rest(){
  if (state !== "play") return;

  disturbed = false; resting = true;
  for (let n = 0; n < 1000 && state === "play" && !disturbed && (player.hp < player.mhp || player.mana < player.mmana); n++){
    if (mons.some(m => m.K && seesMon(m))){ say("You cannot rest with monsters nearby."); break; }
    act(waitAndSearch);

}
/* ---------- the four smart keys (A S D W) and their helpers ---------- */

  const bow = player.eq.bow, ammo = bow && player.inv.find(it => ITEM[it.k].cat === "ammo" && ITEM[it.k].ammo === ITEM[bow.k].ammo);
  if (ammo) return fireAmmo(ammo, true);

function nextSpell(d){ const k = knownSpells(); if (!k.length) return spellKey(); const S = readySpell(), n = k[(k.indexOf(S) + d + k.length) % k.length]; player.ready = n.id; msgs = []; say("Ready: " + n.name + " (" + n.mana + " mana)."); }
// D: the healing potion that best fits your wounds, so a scratch does not use up the strongest one
function bestPotion(){
  const miss = player.mhp - player.hp, list = player.inv.filter(it => { const K = ITEM[it.k]; return K.cat === "potion" && kindKnown(K, player.know) && (K.effect === "heal" || K.effect === "healFull"); })
    .map(it => ({ it, v: ITEM[it.k].effect === "healFull" ? 1e4 : avgDice(ITEM[it.k].dice) })).sort((a, b) => a.v - b.v);

/* ---------- shops: buying, and selling, which tells you what a thing was (the screens are in ui.js) ---------- */
const shopName = it => itemName(it, { ...player.know, known: SHOP_KNOWS.known });
function buy(i, it){
  const S = SHOPS[i], price = buyPrice(it, S, player.stats.cha);
  msgs = [];

  const one = { ...it, n: 1 }, got = carry(one);
  if (!got) return say("You have no room in your pack.");
  player.gold -= price; player.know.known[it.k] = true;
  if (--it.n <= 0) shops[i].stock.splice(shops[i].stock.indexOf(it), 1);
  say("You buy " + nameOf(one) + " for " + price + " gold."); recalc();
}
function sell(i, it){
  const S = SHOPS[i];
  msgs = [];
  if (!shopBuys(S, it)) return say(S.keeper + ": \"I don't deal in those.\"");
  const knew = it.id && kindKnown(ITEM[it.k], player.know);
  it.id = true; delete it.sense; player.know.known[it.k] = true;   // the keeper looks it over and tells you
  if (!knew) say("The keeper looks it over: it is " + nameOf(it, 1) + ".");
  const price = sellPrice(it, S, player.stats.cha);

  const one = { ...it, n: 1 }; takeOne(it); player.gold += price;
  const same = shops[i].stock.find(o => sameItem(o, one)); if (same) same.n++; else shops[i].stock.push(one);

}
const VERB_FILTER = { eat: it => ITEM[it.k].cat === "food" || ITEM[it.k].cat === "mushroom", quaff: it => ITEM[it.k].cat === "potion", read: it => ITEM[it.k].cat === "scroll",
  fuel: it => ITEM[it.k].cat === "flask", wield: it => !!ITEM[it.k].slot && player.inv.includes(it), drop: it => player.inv.includes(it),
  wand: it => ITEM[it.k].cat === "wand", staff: it => ITEM[it.k].cat === "staff", rod: it => ITEM[it.k].cat === "rod", throw: it => player.inv.includes(it), inspect: () => true };
function useWhich(verb){   // the item lists behind single keys: q drink, r read, a aim and so on
  const how = verb === "wand" || verb === "staff" || verb === "rod" ? "use" : verb;
  chooseItem({ eat: "EAT", quaff: "DRINK", read: "READ", fuel: "FILL LANTERN WITH", wield: "WEAR OR WIELD", drop: "DROP", wand: "AIM", staff: "USE", rod: "ZAP", throw: "THROW", inspect: "INSPECT" }[verb] + " WHICH?",
    VERB_FILTER[verb], it => verb === "throw" ? throwItem(it) : verb === "inspect" ? itemDialog(it) : act(() => useItem(it, how)),
    { wand: "You have no wands.", staff: "You have no staffs.", rod: "You have no rods.", read: "You have no scrolls.", quaff: "You have no potions.", eat: "You have nothing to eat." }[verb]);

function verbsFor(it){
  const K = ITEM[it.k], v = [];

  if (K.cat === "potion") v.push(["quaff", "Drink"]);
  if (K.cat === "scroll") v.push(["read", "Read"]);
  if (K.cat === "flask") v.push(["fuel", "Fill lantern"]);
  if (K.cat === "wand" || K.cat === "staff" || K.cat === "rod") v.push(["use", { wand: "Aim", staff: "Use", rod: "Zap" }[K.cat]]);

  const classic = [[ro ? "hjklyubn" : "Arrows / numpad", "move (Shift runs)"], ["g or ,", "pick up"], ["i  e", "pack, equipment"], ["w  " + (ro ? "T" : "t") + "  d", "wear, take off, drop"],
    ["E  q  r", "eat, drink, read"], ["a  " + (ro ? "Z" : "u") + "  z", "aim a wand, use a staff, zap a rod"], ["F", "fill lantern"], ["f  v  I", "fire, throw, inspect"], ["m or p  S", "cast or pray, study"],
    [">  <", "stairs"], ["R  " + (ro ? ". s" : ". 5 s"), "rest, wait and search"], [ro ? "#" : "T", "dig in a direction"], [(ro ? "x" : "l") + "  C", "look, character"], ["Tab", "next target"], ["Esc", "menu"]];
  const guide = [["The aim", "Go down. Morrowgloom the Lantern-Eater waits at 2,500 ft; the dungeon goes on below it."], ["Light", "Your torch burns down. F lights a fresh one or fills a lantern with oil. In the dark you see very little."],
    ["Food", "Eat (E) when you are hungry. Go too long and you grow weak, then faint, then starve."], ["Unknown things", "Potions and scrolls look different every game. Try them, read Identify, or sell one: the keeper tells you what it was."],
    ["The town", "Walk into a numbered door to shop. A scroll of Word of Recall takes you between the town and your deepest level."],
    ["Magic", "Casters need their book in the pack. When you can learn more, open the Book (B) to study."],
    ["Hidden things", "Space waits and searches for secret doors and traps. Walk into a known trap to disarm it, and into a locked door to pick it."],
    ["Digging", "Walk into rubble or a vein of magma or quartz to dig it; T digs plain rock. A shovel or pick in your pack helps."],
    ["Saving", "The game saves as you play. Death is for good: the save is erased and the hall of fame keeps your story."]];
  openDialog({ title: "Help · " + KEYSETS[keySet], heads: ["Keys", "How to play"], cols: [(keySet === "modern" ? modern : classic).map(([a, b]) => ({ html: `<kbd>${esc(a)}</kbd> ${esc(b)}` })),
    guide.map(([a, b]) => ({ html: `<b class="gold">${esc(a)}</b><br><span class="dim">${esc(b)}</span>` }))], side: false, wide: true, onBack: closeDialog, note: "Change the key set in the menu" });
}

/* ---------- title, a new character, and the tombstone ---------- */
function drawScreen(){
  const el = $("screen");
  if (state === "play" || (state === "dead" && stateT < 1)){ el.hidden = true; return; }
  el.hidden = false;
  if (state === "title"){
    el.innerHTML = `<div class="titlecard"><h1>Torchlight<span>Dungeons</span></h1><p class="dim">A dungeon crawl after Moria</p>
      <p class="blink">Press Enter to play</p><p class="dim">Your game saves itself as you play. Esc opens the menu.</p>
      ${scores.list.length ? `<h3>Hall of fame</h3>${scores.list.map((s, k) => `<div class="fame ${k ? "" : "best"}"><b>${s.score}</b> ${esc(s.name || "")} the ${esc(s.race || "")} ${esc(s.cls || "Fighter")}, level ${s.lvl}, ${s.depth} ft, ${esc(s.killer)}</div>`).join("")}` : ""}</div>`;
  } else if (state === "create") drawCreate();
  else if (state === "dead"){
    const T0 = tomb;
    el.innerHTML = `<div class="titlecard tomb"><h1 class="rip">R.I.P.</h1><b>${esc(T0.name)}</b><div>the ${esc(T0.race)} ${esc(T0.cls)}, level ${T0.lvl}</div><div>killed by ${esc(T0.killer)}</div><div>${T0.at === "the town" ? "in the town" : "at " + T0.at}</div>
      <h3>Score ${T0.score}${T0.best ? " · best!" : ""}</h3><p class="blink">Press Enter for the title</p><p class="dim">D saves a character dump</p></div>`;
  }
}
function drawCreate(){
  const steps = ["People", "Calling", "Strengths", "Name"], rows = crRows(), p = crPreview(), R = RACE[p.race], C = CLASS[p.cls];
  const kit = { sellsword: "shortsword", arcanist: "dagger", lampwarden: "mace", delver: "dagger", wayfinder: "shortsword", oathknight: "mace" }[p.cls];
  const show = cr.step === 0 ? RACES[cr.at] : cr.step === 1 ? CLASSES[cr.at] : null;
  const look = { race: cr.step === 0 ? RACES[cr.at].id : p.race, eq: { weapon: cr.step >= 1 ? { sellsword: "shortsword", arcanist: "dagger", lampwarden: "mace", delver: "dagger", wayfinder: "shortsword", oathknight: "mace" }[cr.step === 1 ? CLASSES[cr.at].id : p.cls] : kit, body: "jerkin", light: "torch" } };
  const mods = o => STATS.filter(k => o[k]).map(k => STAT_NAMES[k] + " " + sign(o[k])).join(", ") || "no changes";
  let info = "";
  if (cr.step === 0){ const H = show; info = `<h2>${H.name}</h2><p>${esc(H.desc)}</p><p class="dim">Stats: ${mods(H.stats)}<br>Infravision: ${H.infra ? H.infra * 10 + " ft" : "none"} · hit die ${H.hd} · experience +${H.xp}%</p>`; }
  else if (cr.step === 1){ const K = show, fs = firstSpell(K); info = `<h2>${K.name}</h2><p>${esc(K.desc)}</p><p class="dim">Stats: ${mods(K.stats)}<br>Hit die ${K.hd} · experience +${K.xp}%<br>${fs ? (K.realm === "holy" ? "Holy prayers" : "Arcane spells") + (spellLevel(fs, K) > 1 ? " from level " + spellLevel(fs, K) : "") + ", starting with " + fs.name + "." : "No magic."}<br>Titles: ${K.titles.slice(0, 3).join(", ")} …</p>`; }
  else info = `<h2>${esc(cr.name)}</h2><p class="dim">${R.name} ${C.name}</p><div class="stats">${STATS.map(k => `<span>${STAT_NAMES[k]}<b>${p.stats[k]} <i class="dim">(${sign(statMod(p.stats[k]))})</i></b></span>`).join("")}</div>
    <p>Hit points ${firstHp(p)}${C.realm ? " · mana " + maxMana(p) : ""}</p><div class="stats">${SKILLS.map(k => { const v = skillOf(p, k); return `<span>${SKILL_NAMES[k]}<b>${k === "stealth" ? stealthWord(v) : skillWord(v)}</b></span>`; }).join("")}</div>
    ${cr.step === 2 && cr.mode === "buy" ? `<p class="gold">Points left: ${BUY_POINTS - buySpent(cr.buy)} of ${BUY_POINTS}</p>` : ""}${cr.step === 3 ? `<p class="dim">Type to change the name.</p>` : ""}`;
  $("screen").innerHTML = `<div class="create"><div class="steps">${steps.map((s, i) => `<b class="${i === cr.step ? "on" : i < cr.step ? "done" : ""}">${i + 1} ${s}</b>`).join("")}</div>
    <div class="cbody"><div class="list">${rows.map((r, i) => `<div class="row ${i === cr.at ? "sel" : ""}" data-i="${i}"><span>${esc(r.label)}</span>${cr.step === 2 && cr.mode === "buy" && i < 6 ? `<small>‹ ${cr.buy[STATS[i]]} ›</small>` : ""}</div>`).join("")}
      ${cr.step === 3 ? `<div class="namebox">${esc(cr.name)}<span class="caret">▌</span></div>` : ""}</div>
    <div class="preview">${pic(doll(look, 64), "hero")}</div><div class="cinfo">${info}</div></div>
    <div class="note">↑↓ choose · Enter select · ${cr.step === 2 && cr.mode === "buy" ? "←→ change · " : ""}Esc back</div></div>`;
  $("screen").querySelectorAll(".row[data-i]").forEach(r => r.onclick = () => { cr.at = +r.dataset.i; crChoose(); refreshUI(); });
}

/* ---------- each frame ---------- */
let miniT = 0;
function drawUI(dt){
  miniT -= dt;
  if (uiDirty){
    uiDirty = false;
    drawScreen();
    const playing = player && player.hot && (state === "play" || state === "dead");
    $("ov").hidden = !playing;
    if (playing){ drawHud(); drawPanel(); } else $("panel").hidden = true;
    if (dlg) drawDialog();
    if (tipFor && !document.body.contains(tipFor)) hideTip();
  }
  if (miniT <= 0 && L && player && player.hot && state !== "title"){ miniT = 0.2; drawMinimap($("mini"), 3, true); if (tab === "map" && panelOn) drawBigMap(); }
}

renderLayout(); titleScene();
onResize(stage, renderLayout);
startLoop(tick);
</script>
</body></html>
